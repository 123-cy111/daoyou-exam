<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导游大赛模拟测试</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>导游大赛理论测试</h1>
            <p>随机抽题练习系统 - 智能避免重复</p>
        </header>
        
        <div class="score-board">
            <div class="score">得分: <span id="score">0</span>/10</div>
            <div class="progress">进度: <span id="progress">0</span>/5</div>
        </div>
        
        <!-- 使用统计信息将在这里动态生成 -->
        
        <div id="quiz-container">
            <!-- 题目将在这里动态生成 -->
        </div>
        
        <div class="controls">
            <button id="submit-btn" onclick="checkAnswers()">提交答案</button>
            <button id="reset-btn" onclick="resetQuiz()">重新抽题</button>
            <button id="hint-btn" onclick="showHints()">查看解析</button>
            <button id="clear-btn" onclick="clearHistory()">清空记录</button>
        </div>
        
        <div class="results" id="results">
            <!-- 结果显示在这里 -->
        </div>
    </div>
    
    <script src="data/judgement.js"></script>
    <script src="data/single.js"></script>
    <script src="data/multiple.js"></script>
    <script src="script.js"></script>
</body>
</html>
